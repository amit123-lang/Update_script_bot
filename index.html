<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:monospace;display:flex;flex-direction:column;height:100vh}
#ed{flex:1;background:#111;color:#0f0;border:0;padding:12px;font-size:13px;outline:none;white-space:pre}
button{padding:18px;background:#2AABEE;color:#fff;border:0;font-weight:800;font-size:16px}
#top{padding:10px;background:#111;display:flex;justify-content:space-between}
</style>
</head>
<body>
<div id="top"><b>EDITOR</b><span id="c">0</span></div>
<textarea id="ed" placeholder="Paste code here..."></textarea>
<button onclick="save()">💾 SAVE AS 1.py TO PHONE</button>

<script>
let ed=document.getElementById('ed'), c=document.getElementById('c');
ed.addEventListener('input',()=>c.textContent=ed.value.length+' chars');
(async()=>{
 let u=new URLSearchParams(location.search).get('url');
 if(u){ ed.value=await (await fetch(u)).text(); c.textContent=ed.value.length+' chars'; }
})();

function save(){
 let code=ed.value;
 if(!code){ alert('empty'); return; }
 let blob=new Blob([code], {type:'text/x-python'});
 let a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='1.py'; // <-- FIXED as 1.py
 a.click();
}
</script>
</body>
</html>
