<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fast Editor</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:monospace;display:flex;flex-direction:column;height:100vh}
#top{padding:10px;background:#111;display:flex;justify-content:space-between;align-items:center}
#ed{flex:1;background:#0e0e0e;color:#0f8;border:0;padding:12px;font-size:12px;outline:none}
button{padding:16px;background:#2AABEE;color:#fff;border:0;margin:8px;border-radius:10px;font-weight:800}
#bar{height:3px;background:#222;width:100%}
#prog{height:100%;width:0%;background:#2AABEE;transition:width .2s}
</style>
</head>
<body>
<div id="top"><b>FAST EDITOR</b><span id="st" style="font-size:10px;color:#888">idle</span></div>
<div id="bar"><div id="prog"></div></div>
<textarea id="ed" placeholder="Loading..."></textarea>
<button onclick="save()">💾 SAVE 1.py</button>

<script>
let ed=document.getElementById('ed'), st=document.getElementById('st'), prog=document.getElementById('prog');

function setP(p){ prog.style.width=p+'%'; }

async function fastLoad(){
  let u=new URLSearchParams(location.search).get('url');
  if(!u){ st.textContent='no url - paste manually'; return; }

  st.textContent='loading...'; setP(30);

  // Try 3 fast sources
  let sources=[u, u.replace('tmpfiles.org/dl/','tmpfiles.org/'), 'https://corsproxy.io/?'+encodeURIComponent(u)];

  for(let src of sources){
    try{
      setP(60);
      let ctrl=new AbortController();
      setTimeout(()=>ctrl.abort(), 8000); // 8 sec timeout
      let r=await fetch(src,{signal:ctrl.signal});
      if(!r.ok) continue;
      let txt=await r.text();
      if(txt.length<50) continue;
      ed.value=txt;
      setP(100);
      st.textContent=txt.length+' chars | '+txt.split('\n').length+' lines - LOADED';
      localStorage.setItem('last_code', txt); // cache
      setTimeout(()=>setP(0),1000);
      return;
    }catch(e){ console.log('fail',src,e); }
  }

  // Fallback to cache
  let cached=localStorage.getItem('last_code');
  if(cached){
    ed.value=cached;
    st.textContent='Loaded from cache (offline) - '+cached.length+' chars';
    setP(100);
  }else{
    st.textContent='Slow server - paste code';
  }
}

fastLoad();

function save(){
  let blob=new Blob([ed.value], {type:'text/x-python'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='1.py';
  a.click();
}
</script>
</body>
</html>
