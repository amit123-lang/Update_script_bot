<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:monospace;display:flex;flex-direction:column;height:100vh}
#top{padding:10px;background:#151515;display:flex;justify-content:space-between}
#ed{flex:1;background:#111;color:#0f0;border:0;padding:10px;font-size:12px;outline:none;white-space:pre}
button{padding:15px;margin:6px;border:0;border-radius:10px;font-weight:800}
.b1{background:#2AABEE;color:#fff}
.b2{background:#333;color:#fff}
#log{font-size:10px;color:#888;text-align:center;padding:3px;height:12px}
</style>
</head>
<body>
<div id="top"><b id="title">EDITOR</b><span id="meta" style="font-size:10px;color:#888"></span></div>
<div id="log">starting...</div>
<textarea id="ed"></textarea>
<button class="b1" onclick="saveAndUpdate()">💾 SAVE & UPDATE BOT (sends to /update_bot)</button>
<button class="b2" onclick="saveFile()">📥 DOWNLOAD 1.py to Phone</button>

<script>
let tg=Telegram.WebApp; tg.expand();
let ed=document.getElementById('ed');
let log=document.getElementById('log');
let meta=document.getElementById('meta');

function slog(t){ log.textContent=t; console.log(t); }

// 1. Try load from?url=
async function loadOriginal(){
  let url=new URLSearchParams(location.search).get('url');
  if(!url){
    slog('No url param - paste code or open via /editor');
    ed.placeholder='Paste your bot.py code here...';
    return;
  }
  slog('Loading: '+url.substring(0,40)+'...');
  try{
    let r=await fetch(url);
    if(!r.ok) throw 'http '+r.status;
    let txt=await r.text();
    if(txt.length<100) throw 'too short';
    ed.value=txt;
    meta.textContent=txt.length+' chars | '+txt.split('\n').length+' lines';
    slog('Loaded original script ✅ Now edit');
  }catch(e){
    slog('Load failed: '+e+' - Try opening in Chrome or paste manually');
    ed.placeholder='Load failed. Paste code here manually...';
  }
}
loadOriginal();

function saveAndUpdate(){
  let code=ed.value;
  if(code.length<50){ tg.showAlert('Code empty!'); return; }
  slog('Sending to bot for /update_bot...');
  tg.sendData(code); // This goes to your bot
}

function saveFile(){
  let code=ed.value;
  let blob=new Blob([code],{type:'text/x-python'});
  let a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='1.py';
  a.click();
  slog('Downloaded 1.py - Check Downloads');
}
</script>
</body>
</html>
