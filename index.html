<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot Editor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0a0a0a;color:#fff;font-family:monospace;display:flex;flex-direction:column;height:100vh}
.header{padding:12px;background:#151515;border-bottom:1px solid #222;display:flex;justify-content:space-between}
#len{color:#888;font-size:12px}
#editor{flex:1;background:#111;color:#00ff88;border:none;padding:12px;font-size:13px;outline:none;resize:none}
.footer{padding:10px;background:#151515;display:flex;gap:8px;flex-direction:column}
.btn{padding:14px;border:0;border-radius:10px;font-weight:700;color:#fff}
.btn-blue{background:#2AABEE}
.btn-green{background:#00c853}
#status{font-size:11px;color:#666;text-align:center}
</style>
</head>
<body>
<div class="header"><b>💻 BOT EDITOR</b><span id="len">0 chars</span></div>
<textarea id="editor" spellcheck="false" placeholder="Loading..."></textarea>
<div class="footer">
<button class="btn btn-blue" onclick="downloadPy()">⬇️ Download Edited.py</button>
<button class="btn btn-green" onclick="uploadToBot()">🚀 Upload to Bot (/update_bot)</button>
<div id="status">Ready</div>
</div>

<script>
let tg = Telegram.WebApp; tg.expand();
let ed = document.getElementById('editor');
let len = document.getElementById('len');
let status = document.getElementById('status');

ed.addEventListener('input', ()=> len.textContent = ed.value.length + ' chars | ' + ed.value.split('\n').length + ' lines');

// Load from?url=
(async()=>{
  let u = new URLSearchParams(location.search).get('url');
  if(!u){ ed.placeholder='Paste your py code here...'; status.textContent='Paste code manually'; return; }
  status.textContent='Loading...';
  try{
    let code = await (await fetch(u)).text();
    ed.value = code;
    len.textContent = code.length + ' chars';
    status.textContent='Loaded ✅';
  }catch(e){ status.textContent='Load failed: '+e; }
})();

// Create and download edited py file locally
function downloadPy(){
  let code = ed.value;
  let blob = new Blob([code], {type:'text/x-python'});
  let a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bot_edited.py';
  a.click();
  status.textContent='Downloaded bot_edited.py ✅ Now send to bot with /update_bot';
}

// Upload directly to bot (no external server)
function uploadToBot(){
  let code = ed.value;
  if(code.length < 20){ alert('Code empty!'); return; }
  status.textContent = 'Uploading to bot... ' + code.length + ' chars';

  if(code.length <= 3900){
    // Direct - fastest
    tg.sendData(code);
  }else{
    // Big file - split safe upload using Telegram CloudStorage
    status.textContent='Big file, splitting...';
    // We will send as file via download trick + instruct user
    downloadPy();
    tg.sendData('NEED_FILE|'+code.length);
  }
}
</script>
</body>
</html>
