<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:monospace;display:flex;flex-direction:column;height:100vh}
#ed{flex:1;background:#111;color:#0f0;border:0;padding:10px;font-size:13px}
button{padding:18px;background:#2AABEE;color:#fff;border:0;font-weight:800;font-size:16px;margin:8px;border-radius:10px}
#top{padding:10px;background:#151515;text-align:center}
</style>
</head>
<body>
<div id="top">EDITOR - Saves to Telegram Chat as 1.py</div>
<textarea id="ed" placeholder="Paste code..."></textarea>
<button onclick="send()">📤 SEND 1.py TO MY TELEGRAM CHAT</button>

<script>
let tg=Telegram.WebApp; tg.expand();
let ed=document.getElementById('ed');
(async()=>{
 let u=new URLSearchParams(location.search).get('url');
 if(u){ try{ ed.value=await (await fetch(u)).text(); }catch(e){} }
})();
function send(){
 let code=ed.value;
 if(!code){ alert('empty'); return; }
 // Send directly to bot - no download needed
 tg.sendData(code);
}
</script>
</body>
</html>
