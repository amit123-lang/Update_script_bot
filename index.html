<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:monospace;display:flex;flex-direction:column;height:100vh}
#top{padding:12px;background:#111;text-align:center;border-bottom:1px solid #222}
#ed{flex:1;background:#111;color:#0f0;border:0;padding:10px;font-size:12px;outline:none}
button{padding:16px;margin:6px;border:0;border-radius:10px;font-weight:800;font-size:14px}
.b1{background:#2AABEE;color:#fff}
.b2{background:#00c853;color:#fff}
.b3{background:#333;color:#fff}
#log{font-size:11px;color:#888;text-align:center;padding:5px}
</style>
</head>
<body>
<div id="top">⚡ EDITOR - Uses Your Phone Only</div>
<div id="log">Ready - Load your bot.py file</div>
<input type="file" id="fileInput" accept=".py,.txt" style="display:none">
<button class="b3" onclick="document.getElementById('fileInput').click()">📂 LOAD ORIGINAL bot.py FROM PHONE</button>
<textarea id="ed" placeholder="1. Send /editor in bot
2. Bot will send you bot.py file
3. Download that file
4. Click LOAD FROM PHONE above and select that file
5. It will load INSTANT - no internet needed"></textarea>
<button class="b1" onclick="sendToBot()">💾 SAVE & SEND TO BOT FOR /update_bot</button>
<button class="b2" onclick="download1py()">📥 DOWNLOAD 1.py TO PHONE</button>

<script>
let tg=Telegram.WebApp; tg.expand();
let ed=document.getElementById('ed');
let log=document.getElementById('log');
let fileInput=document.getElementById('fileInput');

fileInput.addEventListener('change', e=>{
  let file=e.target.files[0];
  if(!file) return;
  let reader=new FileReader();
  log.textContent='Loading '+file.name+'...';
  reader.onload=ev=>{
    ed.value=ev.target.result;
    log.textContent='Loaded '+file.name+' : '+ed.value.length+' chars | '+ed.value.split('\n').length+' lines ✅';
  };
  reader.readAsText(file);
});

async function loadFromUrl(){
  let u=new URLSearchParams(location.search).get('url');
  if(!u) return;
  try{
    if(u.startsWith('data:')){
      ed.value=atob(u.split(',')[1]);
      log.textContent='Loaded via data: '+ed.value.length+' chars';
    }else{
      let txt=await (await fetch(u)).text();
      ed.value=txt;
      log.textContent='Loaded: '+txt.length+' chars';
    }
  }catch(e){}
}
loadFromUrl();

function sendToBot(){
  if(ed.value.length<50){ tg.showAlert('Code empty'); return; }
  log.textContent='Sending to bot...';
  tg.sendData(ed.value);
}

function download1py(){
  let code=ed.value;
  if(code.length<50){ tg.showAlert('Code empty'); return; }

  try{
    // Method that WORKS in Mini App - uses your Chrome
    let blob=new Blob([code],{type:'text/x-python'});
    let url=URL.createObjectURL(blob);

    // Try 1: Direct download (works in Chrome)
    let a=document.createElement('a');
    a.href=url;
    a.download='1.py';
    a.style.display='none';
    document.body.appendChild(a);
    a.click();

    // Try 2: Open in external browser where download works
    setTimeout(()=>{
      document.body.removeChild(a);
      // If still in Telegram, open in external browser
      if(window.Telegram && Telegram.WebApp){
        Telegram.WebApp.openLink(url);
        log.textContent='If not downloaded, check Chrome - Opening...';
      }
      setTimeout(()=>URL.revokeObjectURL(url), 5000);
    }, 500);

    log.textContent='Downloading 1.py... Check notification bar';

  }catch(e){
    // Fallback - send to bot, bot will send file back that you CAN download
    log.textContent='Direct download blocked by Telegram, sending via bot...';
    tg.sendData('DOWNLOAD_FILE|'+code);
  }
}
</script>
</body>
</html>
