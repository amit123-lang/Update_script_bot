<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Editor</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>body{background:#0a0a0a;color:#fff;font-family:monospace;margin:0;display:flex;flex-direction:column;height:100vh} #editor{flex:1;background:#161616;color:#00ff88;border:none;padding:12px;font-size:13px;outline:none;white-space:pre}.f{padding:12px;background:#161616} button{background:#2AABEE;color:#fff;border:none;padding:14px;border-radius:10px;width:100%;font-weight:700} #st{font-size:11px;color:#666;text-align:center;margin-top:6px}</style>
</head><body>
<div style="padding:10px;background:#161616">💻 LIVE EDITOR <span id="s" style="float:right;color:#888;font-size:11px"></span></div>
<textarea id="editor" spellcheck="false"></textarea>
<div class="f"><button id="b" onclick="go()">🚀 UPDATE BOT</button><div id="st">Ready</div></div>
<script>
const tg=Telegram.WebApp; tg.expand();
const ed=document.getElementById('editor'), st=document.getElementById('st'), s=document.getElementById('s'), b=document.getElementById('b');
ed.addEventListener('input',()=>s.innerText=ed.value.length+' chars');
(async()=>{
  const u=new URLSearchParams(location.search).get('url');
  if(!u) return;
  st.innerText='Loading...';
  ed.value=await (await fetch(u)).text();
  s.innerText=ed.value.length+' chars'; st.innerText='Ready ✅';
})();
async function go(){
  let code=ed.value;
  if(code.length<20) return alert('empty');
  b.disabled=true;
  if(code.length>3500){
    st.innerText='Uploading '+Math.round(code.length/1024)+'KB to fast server...';
    try{
      // 0x0.st is raw bytes - NO compression, NO change to data
      let fd=new FormData();
      fd.append('file', new Blob([code], {type:'text/x-python'}), 'bot.py');
      let r=await fetch('https://0x0.st', {method:'POST', body: fd});
      let link=(await r.text()).trim();
      st.innerText='Got link, sending to bot...';
      tg.sendData('UPDATE_URL|'+link);
    }catch(e){ st.innerText='Upload failed: '+e; b.disabled=false; }
  } else {
    st.innerText='Sending directly...';
    tg.sendData(code);
  }
}
</script></body></html>
