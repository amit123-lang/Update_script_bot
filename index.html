<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bot Script Editor</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #1e1e1e);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: monospace;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            height: 95vh;
        }
        #status {
            text-align: center;
            font-family: sans-serif;
            color: #aaa;
            margin-bottom: 10px;
        }
        textarea {
            flex-grow: 1;
            background-color: #2d2d2d;
            color: #00ff00;
            border: 1px solid #444;
            padding: 10px;
            font-size: 14px;
            resize: none;
            border-radius: 8px;
            outline: none;
            white-space: pre;
        }
    </style>
</head>
<body>
    <div id="status">🛠️ Ultimate Bot Editor <br><small>Loading script from Termux...</small></div>
    
    <textarea id="codeEditor" placeholder="Your Python script will appear here..."></textarea>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        tg.MainButton.text = "UPDATE BOT SCRIPT";
        tg.MainButton.color = "#28a745";
        tg.MainButton.show();

        // 1. Fetch the script sent by the bot
        const urlParams = new URLSearchParams(window.location.search);
        const scriptUrl = urlParams.get('url');

        if (scriptUrl) {
            const proxyUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent(scriptUrl);
            fetch(proxyUrl)
                .then(response => response.text())
                .then(data => {
                    document.getElementById("codeEditor").value = data;
                    document.getElementById("status").innerHTML = "🛠️ Ultimate Bot Editor <br><small style='color:#0f0'>✅ Script Loaded Successfully!</small>";
                })
                .catch(err => {
                    document.getElementById("status").innerHTML = "🛠️ Ultimate Bot Editor <br><small style='color:red'>❌ Failed to load script.</small>";
                });
        }

        // 2. Upload the new code securely with a CORS proxy bypass
        tg.MainButton.onClick(function() {
            let newCode = document.getElementById("codeEditor").value;
            if(newCode.trim() === "") {
                tg.showAlert("⚠️ Cannot upload an empty script!");
                return;
            }

            tg.MainButton.showProgress();

            // Encode the data so the API accepts it cleanly
            let urlEncodedData = new URLSearchParams();
            urlEncodedData.append('expiry_days', '1');
            urlEncodedData.append('content', newCode);

            // Fetch request routed through corsproxy.io to bypass Android WebView blocks
            fetch('https://corsproxy.io/?https://dpaste.com/api/v2/', {
                method: 'POST',
                body: urlEncodedData,
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                }
            })
            .then(response => {
                if(!response.ok) throw new Error("Upload Failed");
                return response.text();
            })
            .then(url => {
                let cleanUrl = url.trim();
                if (!cleanUrl.startsWith("http")) throw new Error("Invalid URL returned");
                
                let textUrl = cleanUrl + ".txt";
                // Only send the tiny link back to Telegram, preventing the 4000-character crash
                tg.sendData("UPDATE_URL|" + textUrl); 
            })
            .catch(err => {
                tg.MainButton.hideProgress();
                tg.showAlert("❌ Upload Blocked: Network security rejected the connection. Try again.");
            });
        });
    </script>
</body>
</html>
