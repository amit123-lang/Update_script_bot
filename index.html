<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bot Editor - Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body { background:#0f0f0f; color:#fff; font-family: monospace; margin:0; padding:15px; }
h2 { color:#2AABEE; }
#editor { width:100%; height:65vh; background:#1a1a1a; color:#00ff88; border:1px solid #333; border-radius:8px; padding:10px; font-size:13px; }
.row { display:flex; gap:10px; margin:10px 0; }
input { flex:1; background:#1a1a1a; border:1px solid #333; color:#fff; padding:10px; border-radius:6px; }
button { background:#2AABEE; color:#fff; border:none; padding:12px 20px; border-radius:8px; font-weight:bold; width:100%; margin-top:10px; cursor:pointer; }
button.secondary { background:#333; }
#status { margin-top:10px; color:#aaa; font-size:12px; }
</style>
</head>
<body>
<h2>📝 Live Script Editor</h2>
<div class="row">
<input id="gistUrl" placeholder="Paste current script RAW URL (github raw / gist raw)" />
<button onclick="loadCode()" style="width:100px">Load</button>
</div>

<textarea id="editor" placeholder="// Your bot script will appear here..."></textarea>

<div id="status">Ready</div>

<button onclick="updateBot()">🚀 Update Bot via Mini App</button>
<button class="secondary" onclick="saveToGithub()">💾 Save to GitHub Gist</button>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

async function loadCode(){
  const url = document.getElementById('gistUrl').value.trim();
  if(!url) return alert("Enter RAW URL");
  document.getElementById('status').innerText = "Loading...";
  try{
    const r = await fetch(url);
    const text = await r.text();
    document.getElementById('editor').value = text;
    document.getElementById('status').innerText = "Loaded: " + text.length + " chars";
  }catch(e){
    document.getElementById('status').innerText = "Load failed: " + e;
  }
}

function updateBot(){
  const code = document.getElementById('editor').value;
  if(code.length < 10) return alert("Editor empty");
  
  // Create a temporary raw paste using a free service - we will send direct code
  // Since your handler supports direct code + UPDATE_URL, we use direct sendData
  const status = document.getElementById('status');
  status.innerText = "Sending to bot...";
  
  // Option 1: If code is small < 4000 chars, send direct
  if(code.length < 3500){
    tg.sendData(code);
  } else {
    // Option 2: For large code, you need to host raw first then send UPDATE_URL|link
    // This uses gist to host automatically if you set GITHUB TOKEN
    alert("Code too large for direct send. First click Save to GitHub Gist, then it will auto send UPDATE_URL");
    saveToGithub(true);
  }
}

async function saveToGithub(autoSend = false){
  const token = prompt("Enter GitHub Personal Access Token (ghp_...) - needed only once to create raw link:");
  if(!token) return;
  const code = document.getElementById('editor').value;
  document.getElementById('status').innerText = "Uploading to Gist...";
  
  try{
    const res = await fetch("https://api.github.com/gists", {
      method:"POST",
      headers:{ "Authorization":"token "+token, "Content-Type":"application/json" },
      body: JSON.stringify({
        public:false,
        files:{ "bot_script.py": { content: code } }
      })
    });
    const data = await res.json();
    const rawUrl = data.files["bot_script.py"].raw_url;
    document.getElementById('gistUrl').value = rawUrl;
    document.getElementById('status').innerText = "Saved! Raw: " + rawUrl;
    
    if(autoSend || confirm("Gist created. Send UPDATE_URL to bot now?")){
      const payload = "UPDATE_URL|" + rawUrl;
      tg.sendData(payload);
    }
  }catch(e){
    document.getElementById('status').innerText = "GitHub save failed: " + e;
  }
}
</script>
</body>
</html>
