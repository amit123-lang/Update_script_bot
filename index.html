<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:monospace;display:flex;flex-direction:column;height:100vh}
#top{padding:12px;background:#111;text-align:center;border-bottom:1px solid #222}
#ed{flex:1;background:#111;color:#0f0;border:0;padding:10px;font-size:12px;outline:none}
button{padding:16px;margin:6px;border:0;border-radius:10px;font-weight:800;font-size:14px}
.b1{background:#2AABEE;color:#fff}
.b2{background:#00c853;color:#fff}
.b3{background:#333;color:#fff}
#log{font-size:11px;color:#888;text-align:center;padding:5px}
</style>
</head>
<body>
<div id="top">⚡ EDITOR - Mini App + Website</div>
<div id="log">Loading original script...</div>
<input type="file" id="fileInput" accept=".py,.txt" style="display:none">
<button class="b3" onclick="document.getElementById('fileInput').click()">📂 LOAD FROM PHONE (Fallback)</button>
<textarea id="ed" placeholder="Loading..."></textarea>
<button class="b1" onclick="sendToBot()">💾 SAVE & SEND TO BOT FOR /update_bot</button>
<button class="b2" onclick="download1py()">📥 DOWNLOAD 1.py</button>

<script>
let tg=null;
try{ tg=Telegram.WebApp; tg.expand(); }catch(e){}
let ed=document.getElementById('ed');
let log=document.getElementById('log');
let fileInput=document.getElementById('fileInput');

fileInput.addEventListener('change', e=>{
  let file=e.target.files[0];
  if(!file) return;
  let reader=new FileReader();
  reader.onload=ev=>{
    ed.value=ev.target.result;
    log.textContent='Loaded '+file.name+' : '+ed.value.length+' chars ✅';
  };
  reader.readAsText(file);
});

// SMART AUTO-LOAD - Works on BOTH Mini App + Website
async function smartLoad(){
  // 1. Try?url= param (Mini App)
  let u=new URLSearchParams(location.search).get('url');
  if(u){
    try{
      log.textContent='Loading from url param...';
      let txt=u.startsWith('data:')? atob(u.split(',')[1]) : await (await fetch(u)).text();
      if(txt.length>50){ ed.value=txt; log.textContent='Loaded from url: '+txt.length+' chars ✅'; return; }
    }catch(e){ console.log(e); }
  }

  // 2. Try loading bot.py from SAME WEBSITE (your github.io)
  // This makes website https://amit123-lang.github.io/Update_script_bot/ load automatically
  let sources=[
    './bot.py',
    './1.py',
    'bot.py',
    'https://amit123-lang.github.io/Update_script_bot/bot.py'
  ];

  for(let src of sources){
    try{
      log.textContent='Trying to load: '+src+'...';
      let r=await fetch(src, {cache:'no-cache'});
      if(!r.ok) continue;
      let txt=await r.text();
      if(txt.length<100 ||!txt.includes('def') &&!txt.includes('import')) continue;
      ed.value=txt;
      log.textContent='Loaded original from website: '+src+' - '+txt.length+' chars ✅';
      return;
    }catch(e){}
  }

  log.textContent='Auto-load failed - Click LOAD FROM PHONE';
}

smartLoad();

function sendToBot(){
  if(ed.value.length<50){ alert('Code empty'); return; }
  if(tg){
    log.textContent='Sending to bot...';
    tg.sendData(ed.value);
  }else{
    // Website version - download
    download1py();
    log.textContent='On website: File downloaded, send it to bot as document';
  }
}

function download1py(){
  let code=ed.value;
  if(code.length<50){ alert('Code empty'); return; }
  try{
    let blob=new Blob([code],{type:'text/x-python'});
    let url=URL.createObjectURL(blob);
    let a=document.createElement('a');
    a.href=url; a.download='1.py'; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); },1000);
    log.textContent='Downloaded 1.py ✅ Check Downloads';
    if(tg){ try{ tg.openLink(url); }catch(e){} }
  }catch(e){
    if(tg) tg.sendData('DOWNLOAD_FILE|'+code);
  }
}
</script>
</body>
</html>
